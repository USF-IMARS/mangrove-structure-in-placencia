project:
  type: website
  pre-render:
  - R/download_data.R  # download field data from Google Sheets
  - R/prepare_sector_map.R  # dissolve sector polygons for the web map
  - R/prepare_sector_data.R  # derive per-sector tree data, summaries, and biomass points
  resources:
  - static/img/scLogo.png
  - "static/img/Marine Research Logo Design.png"
  # data/*.json and data/placencia-sectors-map.geojson don't need to be listed
  # here: Quarto's OJS engine auto-detects FileAttachment() calls in {ojs}
  # cells and copies those paths to the output directory on its own.
  render:
  - index.qmd
  - field-sampling.qmd
  - satellite-mapping.qmd
  - explorer.qmd
  - sampling-points.qmd
  - vignettes.qmd
  - vignettes/*.qmd

website:
  title: "Mangrove Structure in Placencia"
  navbar:
    left:
      - text: About the Data
        menu:
          - href: field-sampling.qmd
            text: Field Sampling
          - href: satellite-mapping.qmd
            text: Satellite Mapping
      - text: Data Visualizations
        menu:
          - href: explorer.qmd
            text: Sector Explorer
          - href: sampling-points.qmd
            text: Sampling Points
      - href: vignettes.qmd
        text: Vignettes
      - href: https://github.com/USF-IMaRS/mangrove-structure-in-placencia
        text: Source Code
  page-footer:
    center: |
      <div class='footer-logos'>
        <img src='/static/img/scLogo.png' alt='Strong Coasts logo'>
        <img src='/static/img/Marine%20Research%20Logo%20Design.png' alt='USF Institute for Marine Remote Sensing'>
      </div>
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: true
    message: false
    warning: false
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">


